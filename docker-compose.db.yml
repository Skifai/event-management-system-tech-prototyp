# Docker Compose file for database containers only
# This file manages PostgreSQL containers independently from application Run Configurations
# 
# Usage:
#   Start databases:  docker compose -f docker-compose.db.yml up -d
#   Stop databases:   docker compose -f docker-compose.db.yml down
#   View logs:        docker compose -f docker-compose.db.yml logs -f
#
# Containers:
#   - Development DB: localhost:5432 (event-management-db-container)
#   - Production DB:  localhost:5433 (event-management-db-prod-container)

services:
  # Development Database (port 5432)
  postgresdb-dev:
    image: postgres:17-alpine
    container_name: event-management-db-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventmanagement
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Production Database (port 5433)
  postgresdb-prod:
    image: postgres:17-alpine
    container_name: event-management-db-prod-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventmanagement_prod
    ports:
      - "5433:5432"
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data_dev:
  db_data_prod:

networks:
  app-network:
    driver: bridge
  app-network-prod:
    driver: bridge
