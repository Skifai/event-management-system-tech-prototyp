name: Docker Prod - Build Production Native Image

# This workflow is disabled by default. To enable it:
# 1. Uncomment the 'on:' triggers below
# 2. Configure Docker Hub secrets in GitHub repository settings:
#    - DOCKER_USERNAME
#    - DOCKER_PASSWORD
# 3. Set the IMAGE_NAME environment variable

# on:
#   push:
#     branches:
#       - main

env:
  IMAGE_NAME: your-dockerhub-username/event-management-system

jobs:
  docker-native:
    name: Build Native Docker Image (Production)
    runs-on: ubuntu-latest
    # Uncomment this line to enable the workflow
    if: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚡ Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: 🔨 Build Native Image
        run: mvn -Pnative native:compile -DskipTests

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:v${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-prod
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-prod,mode=max
