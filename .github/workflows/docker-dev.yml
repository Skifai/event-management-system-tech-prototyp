name: Docker Dev - Build Development Image

# This workflow is disabled by default. To enable it:
# 1. Uncomment the 'on:' triggers below
# 2. Configure Docker Hub secrets in GitHub repository settings:
#    - DOCKER_USERNAME
#    - DOCKER_PASSWORD
# 3. Set the IMAGE_NAME environment variable

# on:
#   push:
#     branches:
#       - develop

env:
  IMAGE_NAME: your-dockerhub-username/event-management-system

jobs:
  docker-dev:
    name: Build Docker Image (Development)
    runs-on: ubuntu-latest
    # Uncomment this line to enable the workflow
    if: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: 📦 Build JAR
        run: mvn -B -DskipTests clean package

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.dev
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-dev
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-dev,mode=max
