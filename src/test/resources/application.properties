# Test Configuration with PostgreSQL Test Database
# Uses dedicated PostgreSQL container on port 5434
spring.datasource.url=jdbc:postgresql://localhost:5434/eventmanagement_test
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Vaadin for tests
vaadin.launch-browser=false

# Disable test data loading during tests
app.testdata.enabled=false
