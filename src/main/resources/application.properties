# Event Management System - Base Configuration
# This file contains shared configuration across all profiles

# Application Info
spring.application.name=event-management-system
server.port=8080

# PostgreSQL Configuration (can be overridden by environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/eventmanagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect wird automatisch erkannt (PostgreSQL) - keine explizite Angabe nötig

# OSIV (Open Session In View) - Deaktiviert für bessere Performance
# Bei Bedarf Lazy Loading in Transaktionen oder mit JOIN FETCH queries
spring.jpa.open-in-view=false

# Vaadin Configuration
vaadin.productionMode=false
vaadin.launch-browser=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.ch.flossrennen.eventmanagementsystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Test Data Configuration
app.testdata.enabled=true
