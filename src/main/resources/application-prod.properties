# Production Profile Configuration
# Activate with: --spring.profiles.active=prod

# Server Configuration
server.port=8081

# PostgreSQL Production Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresdb:5432/eventmanagement}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate - Update schema automatically (safe for schema changes)
# Note: In a true production environment, consider using Flyway/Liquibase for migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Vaadin Production Mode (optimized, no dev tools)
vaadin.productionMode=true
vaadin.launch-browser=false

# Limited Health Info (security)
management.endpoint.health.show-details=when-authorized

# Production Logging (errors and warnings only)
logging.level.root=WARN
logging.level.ch.flossrennen.eventmanagementsystem=INFO
logging.level.org.hibernate.SQL=WARN

# SQL Initialization - Disabled in production
spring.sql.init.mode=never
