# Production Application Properties
spring.application.name=event-management-system
server.port=8081

# PostgreSQL Configuration for Production
# Uses separate production database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/eventmanagement_prod}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Vaadin Configuration for Production
vaadin.productionMode=true
vaadin.launch-browser=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.ch.flossrennen.eventmanagement=INFO
logging.level.org.hibernate.SQL=WARN

# Test Data Configuration
# Test data loading is disabled by default in production
# Set to true if you want to load test data in production
app.testdata.enabled=false
