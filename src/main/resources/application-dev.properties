# Development Profile Configuration
# Activate with: --spring.profiles.active=dev

# Server Configuration
server.port=8080

# PostgreSQL Development Database
spring.datasource.url=jdbc:postgresql://localhost:5432/eventmanagement
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA/Hibernate - Auto-update schema in development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Vaadin Development Mode (hot-reload enabled)
vaadin.productionMode=false
vaadin.launch-browser=true

# Detailed Health Info
management.endpoint.health.show-details=always

# Debug Logging
logging.level.ch.flossrennen.eventmanagementsystem=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Load Test Data automatically
app.testdata.enabled=true
